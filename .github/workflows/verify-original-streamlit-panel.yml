name: Verify original Streamlit panel integrity

on:
  push:
    branches:
      - experiment/mt5-streamlit-cef147-host-20261117
  pull_request:
    paths:
      - streamlit_panel/app.py
      - streamlit_panel/MT5_HOST_CEF147_EXPERIMENT.md
      - streamlit_panel/MT5_HOST_ARQUITETURA_E_TESTES.md
      - .github/workflows/verify-original-streamlit-panel.yml

jobs:
  verify-original-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify approved app.py SHA-256
        shell: bash
        run: |
          expected="DCB0AF794CD28F4E6AE1B023095DC15FCB39EAA4CF393682E2DD0CB86F2960F7"
          actual="$(sha256sum streamlit_panel/app.py | awk '{print toupper($1)}')"
          echo "Expected approved app.py SHA-256: $expected"
          echo "Actual app.py SHA-256:             $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::app.py is not byte-for-byte identical to the approved Streamlit original. Stop; do not install this branch."
            exit 1
          fi
          echo "Original Streamlit app.py integrity confirmed."

  windows-streamlit-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved app.py SHA-256
        shell: pwsh
        run: |
          $expected = "DCB0AF794CD28F4E6AE1B023095DC15FCB39EAA4CF393682E2DD0CB86F2960F7"
          $actual = (python -c "import hashlib,pathlib; p=pathlib.Path('streamlit_panel/app.py'); b=p.read_bytes().replace(bytes([13,10]),bytes([10])); print(hashlib.sha256(b).hexdigest().upper())").Trim()
          Write-Host "Expected (LF-normalized): $expected"
          Write-Host "Actual (LF-normalized):   $actual"
          if ($actual -ne $expected) { throw "The original approved app.py content does not match after Windows line-ending normalization." }
      - name: Install original Streamlit requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r streamlit_panel/requirements.txt
      - name: Compile-check original app and local modules
        shell: pwsh
        run: |
          python -m py_compile streamlit_panel/app.py streamlit_panel/trusted_identity.py streamlit_panel/presentation.py
      - name: Start Streamlit and verify local health endpoint
        shell: pwsh
        run: |
          $env:CONTROLADOR_API_BASE_URL = "http://127.0.0.1:8000"
          $env:CONTROLADOR_REMOTE_ACCESS_REQUIRED = "false"
          $process = Start-Process -FilePath python -ArgumentList @(
            "-m", "streamlit", "run", "streamlit_panel/app.py",
            "--server.headless", "true",
            "--server.address", "127.0.0.1",
            "--server.port", "8501",
            "--browser.gatherUsageStats", "false"
          ) -PassThru -NoNewWindow
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) { throw "Streamlit exited before health check." }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Trim() -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw "Streamlit health endpoint did not become ready." }
            Write-Host "Original Streamlit app is serving successfully on 127.0.0.1:8501."
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  webview2-composition-build:
    runs-on: windows-latest
    steps:
      - name: Check out Controlador-trade
        uses: actions/checkout@v4
        with:
          path: controlador-trade
      - name: Check out pinned official Microsoft WebView2 sample
        uses: actions/checkout@v4
        with:
          repository: MicrosoftEdge/WebView2Samples
          ref: 06d49d546ba5dc0e2773798ee5b982f68275af4c
          path: webview2-samples
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Point isolated composition sample to the original local Streamlit app
        shell: pwsh
        run: |
          $sample = "webview2-samples/SampleApps/WebView2SampleWinComp/AppWindow.cpp"
          $source = Get-Content $sample -Raw
          $needle = 'm_webView->Navigate(m_sampleUri.c_str());'
          $replacement = 'm_webView->Navigate(L"http://127.0.0.1:8501");'
          if (-not $source.Contains($needle)) { throw "Pinned Microsoft sample navigation point changed; stop for manual review." }
          $source = $source.Replace($needle, $replacement)
          Set-Content -Path $sample -Value $source -Encoding utf8
      - name: Restore pinned sample dependencies
        shell: pwsh
        run: |
          nuget restore "webview2-samples/SampleApps/WebView2SampleWinComp/WebView2SampleWinComp.sln" -PackagesDirectory "webview2-samples/SampleApps/packages"
      - name: Build isolated WebView2 Composition proof of concept
        shell: pwsh
        run: |
          msbuild "webview2-samples/SampleApps/WebView2SampleWinComp/WebView2SampleWinComp.sln" /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
      - name: Upload isolated composition prototype
        uses: actions/upload-artifact@v4
        with:
          name: webview2-composition-streamlit-poc
          path: webview2-samples/SampleApps/WebView2SampleWinComp/Release/x64/*.exe
          if-no-files-found: error
