name: Verify original Streamlit panel integrity

on:
  push:
    branches:
      - experiment/mt5-streamlit-cef147-host-20261117
  pull_request:
    paths:
      - streamlit_panel/app.py
      - streamlit_panel/MT5_HOST_CEF147_EXPERIMENT.md
      - streamlit_panel/MT5_HOST_ARQUITETURA_E_TESTES.md
      - .github/workflows/verify-original-streamlit-panel.yml

jobs:
  verify-original-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Syntax-check read-only native-host DOM bridge
        shell: bash
        run: node --check streamlit_panel/mt5_host/dom_bridge.js
      - name: Exercise DOM bridge state and toggle contract
        shell: bash
        run: node streamlit_panel/mt5_host/dom_bridge.test.cjs
      - name: Guard approved Streamlit panel structure and behavior contract
        shell: bash
        run: node streamlit_panel/mt5_host/panel_contract.test.cjs
      - name: Guard native WebView2 mouse and wheel input mapping
        shell: bash
        run: node streamlit_panel/mt5_host/native_input_contract.test.cjs
      - name: Verify approved app.py SHA-256
        shell: bash
        run: |
          expected="DCB0AF794CD28F4E6AE1B023095DC15FCB39EAA4CF393682E2DD0CB86F2960F7"
          actual="$(sha256sum streamlit_panel/app.py | awk '{print toupper($1)}')"
          echo "Expected approved app.py SHA-256: $expected"
          echo "Actual app.py SHA-256:             $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::app.py is not byte-for-byte identical to the approved Streamlit original. Stop; do not install this branch."
            exit 1
          fi
          echo "Original Streamlit app.py integrity confirmed."

  windows-streamlit-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved app.py SHA-256
        shell: pwsh
        run: |
          $expected = "DCB0AF794CD28F4E6AE1B023095DC15FCB39EAA4CF393682E2DD0CB86F2960F7"
          $actual = (python -c "import hashlib,pathlib; p=pathlib.Path('streamlit_panel/app.py'); b=p.read_bytes().replace(bytes([13,10]),bytes([10])); print(hashlib.sha256(b).hexdigest().upper())").Trim()
          Write-Host "Expected (LF-normalized): $expected"
          Write-Host "Actual (LF-normalized):   $actual"
          if ($actual -ne $expected) { throw "The original approved app.py content does not match after Windows line-ending normalization." }
      - name: Install original Streamlit requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r streamlit_panel/requirements.txt
      - name: Compile-check original app and local modules
        shell: pwsh
        run: |
          python -m py_compile streamlit_panel/app.py streamlit_panel/trusted_identity.py streamlit_panel/presentation.py
      - name: Start Streamlit and verify local health endpoint
        shell: pwsh
        run: |
          $env:CONTROLADOR_API_BASE_URL = "http://127.0.0.1:8000"
          $env:CONTROLADOR_REMOTE_ACCESS_REQUIRED = "false"
          $process = Start-Process -FilePath python -ArgumentList @(
            "-m", "streamlit", "run", "streamlit_panel/app.py",
            "--server.headless", "true",
            "--server.address", "127.0.0.1",
            "--server.port", "8501",
            "--browser.gatherUsageStats", "false"
          ) -PassThru -NoNewWindow
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) { throw "Streamlit exited before health check." }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content.Trim() -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw "Streamlit health endpoint did not become ready." }
            Write-Host "Original Streamlit app is serving successfully on 127.0.0.1:8501."
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  webview2-composition-build:
    runs-on: windows-latest
    steps:
      - name: Check out Controlador-trade
        uses: actions/checkout@v4
        with:
          path: controlador-trade
      - name: Initialize MSVC x64 compiler for native layout contract
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run native layout, DPI, stale-message, and hit-test contract
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX controlador-trade/streamlit_panel/mt5_host/layout_contract.test.cpp /Fe:layout_contract.test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native layout contract did not compile." }
          .\\layout_contract.test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native layout contract tests failed." }
      - name: Check out pinned official Microsoft WebView2 sample
        uses: actions/checkout@v4
        with:
          repository: MicrosoftEdge/WebView2Samples
          ref: 06d49d546ba5dc0e2773798ee5b982f68275af4c
          path: webview2-samples
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Point isolated composition sample to the original local Streamlit app
        shell: pwsh
        run: |
          $sample = "webview2-samples/SampleApps/WebView2SampleWinComp/AppWindow.cpp"
          $source = Get-Content $sample -Raw
          $needle = 'm_webView->Navigate(m_sampleUri.c_str());'
          $replacement = 'm_webView->Navigate(L"http://127.0.0.1:8501");'
          if (-not $source.Contains($needle)) { throw "Pinned Microsoft sample navigation point changed; stop for manual review." }
          $source = $source.Replace($needle, $replacement)
          Set-Content -Path $sample -Value $source -Encoding utf8
      - name: Pin temporary sample to stable WebView2 and WIL SDKs
        shell: pwsh
        run: |
          $project = "webview2-samples/SampleApps/WebView2SampleWinComp/WebView2SampleWinComp.vcxproj"
          $packages = "webview2-samples/SampleApps/WebView2SampleWinComp/packages.config"
          $projectText = Get-Content $project -Raw
          $packageText = Get-Content $packages -Raw
          $projectText = $projectText.Replace("1.0.1056-prerelease", "1.0.4314.35").Replace("1.0.200902.2", "1.0.260126.7")
          $packageText = $packageText.Replace("1.0.1056-prerelease", "1.0.4314.35").Replace("1.0.200902.2", "1.0.260126.7")
          if ($projectText.Contains("1.0.1056-prerelease") -or $projectText.Contains("1.0.200902.2") -or $packageText.Contains("1.0.1056-prerelease") -or $packageText.Contains("1.0.200902.2")) {
            throw "Old WebView2/WIL dependency reference remains; stop."
          }
          if (-not $projectText.Contains("1.0.4314.35") -or -not $projectText.Contains("1.0.260126.7") -or -not $packageText.Contains("1.0.4314.35") -or -not $packageText.Contains("1.0.260126.7")) {
            throw "Stable WebView2 SDK / WIL dependency replacement did not complete; stop."
          }
          Set-Content -Path $project -Value $projectText -Encoding utf8
          Set-Content -Path $packages -Value $packageText -Encoding utf8
          Write-Host "Temporary Microsoft sample pinned to stable WebView2 1.0.4314.35 and WIL 1.0.260126.7."
      - name: Use stable Composition API declarations from WebView2.h
        shell: pwsh
        run: |
          $header = "webview2-samples/SampleApps/WebView2SampleWinComp/CompositionHost.h"
          $source = Get-Content $header -Raw
          $experimentalInclude = '#include "WebView2Experimental.h"'
          if (-not $source.Contains($experimentalInclude)) { throw "Expected legacy experimental header include not found; stop." }
          $source = $source.Replace($experimentalInclude, "")
          if ($source.Contains("WebView2Experimental.h") -or $source.Contains("ICoreWebView2Experimental")) {
            throw "Experimental API reference remains in CompositionHost.h; stop."
          }
          Set-Content -Path $header -Value $source -Encoding utf8
          Write-Host "Using stable composition interfaces declared by WebView2.h."
      - name: Apply isolated clipped-viewport experiment to temporary Microsoft sample
        shell: pwsh
        run: |
          $sourcePath = "webview2-samples/SampleApps/WebView2SampleWinComp/CompositionHost.cpp"
          $source = Get-Content $sourcePath -Raw
          $wheelPointPattern = '(?s)void CompositionHost::OnMouseMessage\(UINT message, WPARAM wParam, LPARAM lParam\)\s*\{.*?\n\}'
          $wheelPointReplacement = @'
          void CompositionHost::OnMouseMessage(UINT message, WPARAM wParam, LPARAM lParam)
          {
              if (m_rootVisual && m_compositionController)
              {
                  POINT point{ GET_X_LPARAM(lParam), GET_Y_LPARAM(lParam) };
                  // Wheel messages carry screen coordinates; convert them to host-client coordinates.
                  if (message == WM_MOUSEWHEEL || message == WM_MOUSEHWHEEL)
                  {
                      ScreenToClient(m_appWindow->GetMainWindow(), &point);
                  }
                  UpdateVisual(point, message, wParam);
              }
          }
          '@
          $sourceWithWheelCoordinates = [regex]::Replace($source, $wheelPointPattern, $wheelPointReplacement, 1)
          if ($sourceWithWheelCoordinates -eq $source) { throw "Could not patch wheel coordinate conversion." }
          $source = $sourceWithWheelCoordinates
          $createPattern = '(?s)void CompositionHost::CreateVisuals\(\)\s*\{.*?\n\}'
          $createReplacement = @'
          void CompositionHost::CreateVisuals()
          {
              // One full-viewport WebView visual; only its lower-left panel rectangle is clipped.
              CreateWebViewVisual();
          }
          '@
          $source2 = [regex]::Replace($source, $createPattern, $createReplacement, 1)
          if ($source2 -eq $source) { throw "Could not isolate CreateVisuals for clipped-viewport experiment." }
          $resizePattern = '(?s)void CompositionHost::ResizeAllVisuals\(\)\s*\{.*?\n\}'
          $resizeReplacement = @'
          void CompositionHost::ResizeAllVisuals()
          {
              if (!m_webViewVisual || !m_rootVisual) return;
              const float width = static_cast<float>(m_appBounds.right - m_appBounds.left);
              const float height = static_cast<float>(m_appBounds.bottom - m_appBounds.top);
              m_webViewVisual.Size({ width, height });
              m_webViewVisual.Offset({ 0.0f, 0.0f, 0.0f });
              auto clip = m_compositor.CreateInsetClip();
              clip.LeftInset(0.0f);
              clip.TopInset(height > 460.0f ? height - 460.0f : 0.0f);
              clip.RightInset(width > 420.0f ? width - 420.0f : 0.0f);
              clip.BottomInset(0.0f);
              m_webViewVisual.Clip(clip);
              // Keep the browser viewport at the full client size so fixed-position
              // Streamlit elements retain their original bottom-left coordinates.
              SetWebViewVisualBounds();
          }
          '@
          $source3 = [regex]::Replace($source2, $resizePattern, $resizeReplacement, 1)
          if ($source3 -eq $source2) { throw "Could not isolate ResizeAllVisuals for clipped-viewport experiment." }
          $mousePattern = '(?s)void CompositionHost::UpdateVisual\(POINT point, UINT message, WPARAM wParam\)\s*\{.*?\n\}'
          $mouseReplacement = @'
          void CompositionHost::UpdateVisual(POINT point, UINT message, WPARAM wParam)
          {
              const LONG width = m_appBounds.right - m_appBounds.left;
              const LONG height = m_appBounds.bottom - m_appBounds.top;
              const LONG top = height > 460 ? height - 460 : 0;
              const LONG right = width > 420 ? 420 : width;
              // Mirror the visible clip for hit testing: outside events are not sent to WebView2.
              if (point.x < 0 || point.x >= right || point.y < top || point.y >= height) return;
              COREWEBVIEW2_MOUSE_EVENT_KIND kind;
              UINT32 mouseData = 0;
              switch (message)
              {
              case WM_MOUSEMOVE: kind = COREWEBVIEW2_MOUSE_EVENT_KIND_MOVE; break;
              case WM_LBUTTONDOWN: kind = COREWEBVIEW2_MOUSE_EVENT_KIND_LEFT_BUTTON_DOWN; break;
              case WM_LBUTTONUP: kind = COREWEBVIEW2_MOUSE_EVENT_KIND_LEFT_BUTTON_UP; break;
              case WM_RBUTTONDOWN: kind = COREWEBVIEW2_MOUSE_EVENT_KIND_RIGHT_BUTTON_DOWN; break;
              case WM_RBUTTONUP: kind = COREWEBVIEW2_MOUSE_EVENT_KIND_RIGHT_BUTTON_UP; break;
              case WM_MBUTTONDOWN: kind = COREWEBVIEW2_MOUSE_EVENT_KIND_MIDDLE_BUTTON_DOWN; break;
              case WM_MBUTTONUP: kind = COREWEBVIEW2_MOUSE_EVENT_KIND_MIDDLE_BUTTON_UP; break;
              case WM_MOUSEWHEEL:
                  kind = COREWEBVIEW2_MOUSE_EVENT_KIND_WHEEL;
                  mouseData = static_cast<UINT32>(GET_WHEEL_DELTA_WPARAM(wParam));
                  break;
              case WM_MOUSEHWHEEL:
                  kind = COREWEBVIEW2_MOUSE_EVENT_KIND_HORIZONTAL_WHEEL;
                  mouseData = static_cast<UINT32>(GET_WHEEL_DELTA_WPARAM(wParam));
                  break;
              default: return;
              }
              if (m_webViewVisual && m_compositionController)
              {
                  CHECK_FAILURE(m_compositionController->SendMouseInput(
                      kind,
                      static_cast<COREWEBVIEW2_MOUSE_EVENT_VIRTUAL_KEYS>(GET_KEYSTATE_WPARAM(wParam)),
                      mouseData, point));
              }
          }
          '@
          $source4 = [regex]::Replace($source3, $mousePattern, $mouseReplacement, 1)
          if ($source4 -eq $source3) { throw "Could not isolate UpdateVisual for clipped hit testing." }
          Set-Content -Path $sourcePath -Value $source4 -Encoding utf8
          Write-Host "Temporary sample now tests full viewport + lower-left 420x460 visual clip and matching mouse hit test."
      - name: Restore pinned sample dependencies
        shell: pwsh
        run: |
          nuget restore "webview2-samples/SampleApps/WebView2SampleWinComp/WebView2SampleWinComp.sln" -PackagesDirectory "webview2-samples/SampleApps/packages"
      - name: Compile and run native WebView2 mouse input contract
        shell: pwsh
        run: |
          $include = "webview2-samples/SampleApps/packages/Microsoft.Web.WebView2.1.0.4314.35/build/native/include"
          cl /nologo /std:c++17 /EHsc /W4 /WX /I $include controlador-trade/streamlit_panel/mt5_host/native_input_contract.test.cpp /Fe:native_input_contract.test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native WebView2 input contract did not compile." }
          .\\native_input_contract.test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native WebView2 input contract tests failed." }
      - name: Compile and run Win32 mouse routing and cursor bridge contract
        shell: pwsh
        run: |
          $include = "webview2-samples/SampleApps/packages/Microsoft.Web.WebView2.1.0.4314.35/build/native/include"
          cl /nologo /std:c++17 /EHsc /W4 /WX /I $include controlador-trade/streamlit_panel/mt5_host/native_input_router.test.cpp /Fe:native_input_router.test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native Win32 input router did not compile." }
          .\\native_input_router.test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native Win32 input router tests failed." }
      - name: Build isolated WebView2 Composition proof of concept
        shell: pwsh
        run: |
          msbuild "webview2-samples/SampleApps/WebView2SampleWinComp/WebView2SampleWinComp.sln" /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
      - name: Upload isolated composition prototype
        uses: actions/upload-artifact@v4
        with:
          name: webview2-streamlit-clipped-viewport-poc
          path: webview2-samples/SampleApps/WebView2SampleWinComp/Release/x64/*.exe
          if-no-files-found: error
