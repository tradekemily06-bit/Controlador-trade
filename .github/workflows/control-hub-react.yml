name: Control Hub React

on:
  push:
    branches:
      - rebuild/control-hub-react-reference
    paths:
      - "frontend/control-hub/**"
      - ".github/workflows/control-hub-react.yml"
  pull_request:
    paths:
      - "frontend/control-hub/**"
      - ".github/workflows/control-hub-react.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/control-hub
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build React application
        run: npm run build
