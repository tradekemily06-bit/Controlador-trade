name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Keep only the newest validation run for a branch. This prevents a stream of
# superseded PR commits from occupying the Actions pending queue and ensures
# CI validates the latest tree rather than stale intermediate revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run P1.9 robustness tests
        run: python -m pytest -q core/test_strategy_robustness.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Dependency security audit
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r requirements.txt

      - name: Compile all Python project surfaces
        run: python -m compileall -q app.py core data execution audit analysis integration security_guard.py security_audit.py web

      - name: Build production container
        run: docker build --tag controlador-trade:ci .

      - name: Smoke test production container health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs controlador-trade-ci || true
            docker rm -f controlador-trade-ci || true
          }
          trap cleanup EXIT

          docker run -d --name controlador-trade-ci -p 7860:7860 controlador-trade:ci

          for attempt in {1..30}; do
            if python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:7860/api/health", timeout=3) as response:
              if response.status != 200:
                  raise SystemExit(1)
              payload = json.loads(response.read().decode("utf-8"))

          if payload.get("ok") is not True:
              raise SystemExit(1)
          PY
            then
              echo "Container health endpoint is ready."
              exit 0
            fi
            sleep 2
          done

          echo "Container health endpoint did not become ready."
          exit 1
