name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r requirements.txt
          python -m pip install -r streamlit_panel/requirements.txt

      - name: Run P1.9 robustness tests
        run: python -m pytest --import-mode=importlib -q core/test_strategy_robustness.py

      - name: Run full test suite
        env:
          # Tests use loopback WSGI requests; opt in only inside this isolated CI step.
          CONTROLADOR_REMOTE_ACCESS_REQUIRED: "false"
          CONTROLADOR_LOCAL_MUTATIONS_ALLOWED: "true"
          CONTROLADOR_LOCAL_MUTATION_HOSTS: "localhost,127.0.0.1,[::1]"
        run: python -m pytest --import-mode=importlib -q

      - name: Dependency security audit
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r requirements.txt

      - name: Compile all Python project surfaces
        run: python -m compileall -q app.py assistant finance core data execution audit analysis integration security_guard.py security_audit.py web streamlit_panel

      - name: Start Streamlit panel and verify HTTP health
        env:
          CONTROLADOR_SINGLE_USER_IDENTITY: streamlit-ci-owner
          CONTROLADOR_REMOTE_ACCESS_REQUIRED: "false"
          CONTROLADOR_API_BASE_URL: http://127.0.0.1:9
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run streamlit_panel/app.py \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            --server.headless true \
            --browser.gatherUsageStats false > /tmp/controlador-streamlit-ci.log 2>&1 &
          streamlit_pid=$!
          cleanup() {
            kill "$streamlit_pid" 2>/dev/null || true
            wait "$streamlit_pid" 2>/dev/null || true
            cat /tmp/controlador-streamlit-ci.log
          }
          trap cleanup EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$streamlit_pid" 2>/dev/null; then
              echo "Streamlit exited before becoming healthy."
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Streamlit panel did not become healthy within 60 seconds."
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8501/ >/dev/null
          echo "Streamlit panel started and served its browser entry point."

      - name: Build production container
        run: docker build --tag controlador-trade:ci .

      - name: Smoke test production container health
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs controlador-trade-ci || true
            docker rm -f controlador-trade-ci || true
          }
          trap cleanup EXIT

          docker run -d --name controlador-trade-ci -p 7860:7860 \
            -e CONTROLADOR_SINGLE_USER_IDENTITY=container-smoke-user \
            -e CONTROLADOR_RUNTIME_DIR=/tmp/controlador-runtime-ci \
            controlador-trade:ci

          for attempt in {1..60}; do
            health_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' controlador-trade-ci 2>/dev/null || true)"
            case "$health_status" in
              healthy)
                echo "Container health endpoint is ready."
                exit 0
                ;;
              unhealthy)
                echo "Container healthcheck reported unhealthy; retrying while the startup window remains."
                ;;
            esac
            sleep 2
          done

          echo "Container health endpoint did not become healthy within 120 seconds."
          exit 1

  windows-powershell-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse deployment PowerShell scripts
        shell: powershell
        run: |
          $deployment = Join-Path $env:GITHUB_WORKSPACE 'deployment'
          $paths = @(
            'sync_mql5_panel.ps1',
            'prepare_mt5_preview.ps1',
            'start_controlador_runtime.ps1',
            'start_mt5_runtime.ps1',
            'validate_windows_runtime.ps1',
            'validate_fiscal_assistant_runtime.ps1',
            'install_windows_autostart.ps1',
            'backup_runtime.ps1',
            'restore_runtime.ps1',
            'bootstrap_windows_runtime.ps1',
            'start_streamlit_panel.ps1'
          )
          foreach ($relative in $paths) {
            $path = Join-Path $deployment $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required deployment script missing: $path"
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Error ("PowerShell parse errors in {0}: {1}" -f $path, ($parseErrors | Out-String))
              exit 1
            }
            Write-Host "PowerShell syntax OK: $relative"
          }

      - name: Execute MT5 sync -WhatIf without a live terminal or EA writes
        shell: powershell
        run: |
          $root = Join-Path $env:TEMP ("controlador-mt5-whatif-" + [guid]::NewGuid().ToString('N'))
          $terminalDir = Join-Path $root 'terminal'
          $dataPath = Join-Path $root 'data'
          $emptyAppData = Join-Path $root 'empty-appdata'
          New-Item -ItemType Directory -Force -Path $terminalDir, (Join-Path $dataPath 'MQL5'), $emptyAppData | Out-Null
          $terminal = Join-Path $terminalDir 'terminal64.exe'
          $metaEditor = Join-Path $terminalDir 'metaeditor64.exe'
          Set-Content -LiteralPath $terminal -Value 'fake terminal for WhatIf test'
          Set-Content -LiteralPath $metaEditor -Value 'fake MetaEditor for WhatIf test'
          $terminalHash = (Get-FileHash -LiteralPath $terminal -Algorithm SHA256).Hash
          $metaEditorHash = (Get-FileHash -LiteralPath $metaEditor -Algorithm SHA256).Hash
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'deployment\sync_mql5_panel.ps1'
          $destinationDir = Join-Path $dataPath 'MQL5\Experts\ControladorTrading'

          # Positive dry-run: explicit paths, no terminal process, and no EA destination.
          & $scriptPath -WhatIf -ProjectRoot $env:GITHUB_WORKSPACE -Mt5TerminalPath $terminal -Mt5DataPath $dataPath -MetaEditorPath $metaEditor
          if (Test-Path -LiteralPath $destinationDir) {
            throw 'WhatIf criou a pasta de destino do EA.'
          }
          if ((Get-FileHash -LiteralPath $terminal -Algorithm SHA256).Hash -ne $terminalHash) {
            throw 'WhatIf alterou o executável de teste do terminal.'
          }
          if ((Get-FileHash -LiteralPath $metaEditor -Algorithm SHA256).Hash -ne $metaEditorHash) {
            throw 'WhatIf alterou o executável de teste do MetaEditor.'
          }

          # Negative dry-run: unresolved data path must fail before process inspection or Python bridge.
          $previousAppData = $env:APPDATA
          try {
            $env:APPDATA = $emptyAppData
            $caughtExpectedGuard = $false
            try {
              & $scriptPath -WhatIf -ProjectRoot $env:GITHUB_WORKSPACE -Mt5TerminalPath $terminal -MetaEditorPath $metaEditor
            } catch {
              if ($_.Exception.Message -like '*Simulação -WhatIf não inicializa nem consulta o terminal MT5*') {
                $caughtExpectedGuard = $true
              } else {
                throw
              }
            }
            if (-not $caughtExpectedGuard) {
              throw 'WhatIf deveria recusar a resolução implícita da pasta de dados.'
            }
          } finally {
            $env:APPDATA = $previousAppData
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'MT5 sync WhatIf runtime checks passed without a live terminal or EA writes.'

  test:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - name: Protected-branch compatibility check
        run: echo "CI completed successfully; legacy required check test is satisfied."

  publish-required-status-contexts:
    name: Publish required commit status contexts
    if: always()
    needs: [CI, test, windows-powershell-validation]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mirror required-check results to legacy commit statuses
        uses: actions/github-script@v9
        env:
          CI_RESULT: ${{ needs.CI.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-powershell-validation.result }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const passed = process.env.CI_RESULT === "success" &&
              process.env.TEST_RESULT === "success" &&
              process.env.WINDOWS_RESULT === "success";
            const state = passed ? "success" : "failure";
            const description = passed
              ? "CI and test jobs completed successfully"
              : "CI or test job failed; merge must remain blocked";
            for (const statusContext of ["CI", "test"]) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.TARGET_SHA,
                state,
                context: statusContext,
                description
              });
            }
