name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run P1.9 robustness tests
        run: python -m pytest -q core/test_strategy_robustness.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Dependency security audit
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r requirements.txt

      - name: Compile all Python project surfaces
        run: python -m compileall -q app.py core data execution audit analysis integration security_guard.py security_audit.py web

      - name: Build production container
        run: docker build --tag controlador-trade:ci .

      - name: Smoke test production container and Figma panel route
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs controlador-trade-ci || true
            docker rm -f controlador-trade-ci || true
          }
          trap cleanup EXIT

          docker run -d --name controlador-trade-ci -p 7860:7860 controlador-trade:ci

          ready=false
          for attempt in {1..60}; do
            health_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' controlador-trade-ci 2>/dev/null || true)"
            case "$health_status" in
              healthy)
                echo "Container health endpoint is ready."
                ready=true
                break
                ;;
              unhealthy)
                echo "Container healthcheck reported unhealthy; retrying while the startup window remains."
                ;;
            esac
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Container health endpoint did not become healthy within 120 seconds."
            exit 1
          fi

          python - <<'PY'
          import re
          from urllib.error import HTTPError
          from urllib.request import urlopen

          base = "http://127.0.0.1:7860"

          def get(path):
              with urlopen(base + path, timeout=10) as response:
                  body = response.read()
                  print(f"HTTP {response.status}: {path} ({len(body)} bytes)")
                  return body

          html = get("/painel/").decode("utf-8")
          assets = re.findall(r'''(?:src|href)="([^"]*/assets/[^"]+)"''', html)
          if not assets:
              raise SystemExit("Figma panel HTML loaded, but no built /assets/ references were found.")
          for asset in assets:
              if not asset.startswith("/"):
                  asset = "/" + asset
              get(asset)

          get("/api/health")
          print("Figma panel route, built assets, and ecosystem health endpoint passed.")
          PY

  windows-powershell-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse deployment PowerShell scripts
        shell: powershell
        run: |
          $deployment = Join-Path $env:GITHUB_WORKSPACE 'deployment'
          $paths = @(
            'sync_mql5_panel.ps1',
            'prepare_mt5_preview.ps1',
            'start_controlador_runtime.ps1',
            'start_mt5_runtime.ps1',
            'validate_windows_runtime.ps1',
            'install_windows_autostart.ps1',
            'bootstrap_windows_runtime.ps1'
          )
          foreach ($relative in $paths) {
            $path = Join-Path $deployment $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required deployment script missing: $path"
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              Write-Error ("PowerShell parse errors in {0}: {1}" -f $path, ($parseErrors | Out-String))
              exit 1
            }
            Write-Host "PowerShell syntax OK: $relative"
          }

  test:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      - name: Protected-branch compatibility check
        run: echo "CI completed successfully; legacy required check test is satisfied."

  publish-required-status-contexts:
    name: Publish required commit status contexts
    if: always()
    needs: [CI, test, windows-powershell-validation]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mirror required-check results to legacy commit statuses
        uses: actions/github-script@v9
        env:
          CI_RESULT: ${{ needs.CI.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-powershell-validation.result }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          script: |
            const passed = process.env.CI_RESULT === "success" &&
              process.env.TEST_RESULT === "success" &&
              process.env.WINDOWS_RESULT === "success";
            const state = passed ? "success" : "failure";
            const description = passed
              ? "CI and test jobs completed successfully"
              : "CI or test job failed; merge must remain blocked";
            for (const statusContext of ["CI", "test"]) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.TARGET_SHA,
                state,
                context: statusContext,
                description
              });
            }
