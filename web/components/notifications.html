<section class="card notification-center" id="notificationCenter" aria-label="Notificações do ecossistema">
  <div class="row">
    <div>
      <div class="module-title">Notificações</div>
      <div class="muted">Somente eventos relevantes aparecem por padrão.</div>
    </div>
    <span id="notificationBadge" class="runtime-badge hidden" aria-live="polite">0</span>
  </div>
  <div id="notificationCritical" class="list" aria-live="assertive"></div>
  <div id="notificationImportant" class="list" aria-live="polite"></div>

  <div id="notificationInfo" class="list hidden"></div>
</section>
