<!-- Dedicated configuration area: advanced leverage controls stay off the main operation card. -->
<section id="alavancagem" class="section">
  <div class="module-title">Alavancagem</div>
  <div class="card">
    <p class="muted">Avaliação isolada de risco de alavancagem. O resultado nunca autoriza execução.</p>
    <div class="controls">
      <label>Perfil <select id="leverageProfile"><option value="">Selecionar perfil</option></select></label>
      <label>Ativo <input id="leverageSymbol" placeholder="Ex.: EURUSD"></label>
      <label>Alavancagem solicitada <input id="leverageValue" type="number" min="0" step="any"></label>
      <label>Capital alocado <input id="leverageCapital" type="number" min="0" step="any"></label>
      <label>Quantidade <input id="leverageQuantity" type="number" min="0" step="any"></label>
      <label>Preço <input id="leveragePrice" type="number" min="0" step="any"></label>
      <label>Distância de stop <input id="leverageStop" type="number" min="0" step="any"></label>
      <label>Valor por unidade de preço <input id="leverageUnitValue" type="number" min="0" step="any"></label>
      <label>Perda máxima permitida <input id="leverageMaxLoss" type="number" min="0" step="any"></label>
      <button class="btn" id="assessLeverage">AVALIAR ALAVANCAGEM</button>
    </div>
    <div id="leverageResult" class="item" hidden></div>
  </div>
</section>

<section id="personalizacao-imagem" class="section">
  <div class="module-title">Imagem do ecossistema</div>
  <div class="card">
    <p class="muted">Personalização visual isolada da operação.</p>
    <div class="controls">
      <label>Tipo <select id="ecosystemImageKind"><option value="profile">Perfil</option><option value="logo">Logo</option><option value="background">Fundo</option></select></label>
      <label>Imagem <input id="ecosystemImage" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <div id="ecosystemImagePreview" class="item" hidden></div>
      <button class="btn alt" id="saveEcosystemImage">SALVAR IMAGEM</button>
      <div id="ecosystemImageStatus" class="muted">JPG, PNG ou WebP. Limite: 5 MB.</div>
    </div>
  </div>
</section>
